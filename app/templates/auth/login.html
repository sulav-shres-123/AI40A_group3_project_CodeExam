{% extends "base.html" %}
{% block title %}Log in · CodeExam{% endblock %}
{% block content %}
<section class="card card-narrow">
  <h1>Log in</h1>

  <div aria-live="assertive">
    {% if error %}<p class="form-error" id="login-error">{{ error }}</p>{% endif %}
  </div>

  {# No action attribute: the form posts back to this URL, keeping any ?next= #}
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required autofocus
           value="{{ email or '' }}" {% if error %}aria-describedby="login-error"{% endif %}>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
</section>
{% endblock %}
